<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PaperIsHere Settings</title>
  <style>
    :root {
      --black: #000000;
      --white: #ffffff;
      --purple: #7851A9;
      --gray: #666666;
    }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--white);
      color: var(--black);
      padding: 24px;
      width: 320px;
      margin: 0;
      box-sizing: border-box;
      /* کادر دور افزونه نازک‌تر شد (از 4 به 2 پیکسل) */
      border: 2px solid var(--black); 
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      text-transform: uppercase;
      margin: 0;
      color: var(--black);
    }

    .subtitle {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gray);
      margin-top: 4px;
      margin-bottom: 0;
    }

    /* خط جداکننده بالا کاملاً نازک و ساده شد */
    .light-divider {
      border-top: 2px solid var(--black);
      height: 0;
      margin: 0 0 20px 0;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      color: var(--black);
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 12px; /* کمی پدینگ بیشتر برای حس راحتی */
      font-size: 15px; /* فونت درشت‌تر شد */
      font-weight: 600; /* فونت ضخیم‌تر (Bold) شد */
      font-family: 'Courier New', Courier, monospace;
      background-color: var(--white);
      border: 2px solid var(--black);
      border-radius: 0;
      color: var(--black);
      outline: none;
      transition: all 0.2s ease;
      margin-bottom: 20px;
    }

    /* رنگ متن پیش‌فرضِ داخل باکس‌ها کمی پررنگ‌تر شد */
    input::placeholder {
      color: #888888;
      font-weight: 500;
    }

    input:focus {
      border-color: var(--purple);
      box-shadow: 3px 3px 0px var(--purple);
    }

    .advanced-toggle {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--black);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 8px;
      border-top: 2px solid var(--black);
      border-bottom: 2px solid var(--black);
      transition: background-color 0.2s, color 0.2s;
      margin-bottom: 16px;
    }

    .advanced-toggle:hover {
      background-color: var(--black);
      color: var(--white);
    }

    #advancedOptions {
      display: none;
      padding-top: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 14px;
      font-weight: 900;
      background-color: var(--white);
      color: var(--black);
      border: 2px solid var(--black);
      border-radius: 0;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 4px 4px 0px var(--black);
      transition: all 0.1s ease;
      margin-top: 8px;
    }

    button:hover {
      background-color: var(--purple);
      color: var(--white);
      border-color: var(--black);
      box-shadow: 4px 4px 0px var(--black);
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px var(--black);
    }

    #status {
      font-size: 11px;
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
      height: 16px;
      color: var(--purple);
      margin-top: 14px;
    }
  </style>
</head>
<body>
  
  <div class="header">
    <h1>PaperIsHere</h1>
    <p class="subtitle">Configuration</p>
  </div>
  
  <div class="light-divider"></div>
  
  <label>Save Folder (Downloads)</label>
  <input type="text" id="saveLocation" placeholder="Renamed Papers">

  <div class="advanced-toggle" id="toggleAdvancedBtn">
    <span>+ Advanced Settings</span>
  </div>

  <div id="advancedOptions">
      <label>Nexus Bot (Telegram)</label>
      <input type="text" id="nexusBot" placeholder="sks7777777nexusbot">
      
      <label>Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="Insert Key...">
  </div>
  
  <button id="saveBtn">Save Settings</button>
  <div id="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
