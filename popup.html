<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PaperIsHere Configuration</title>
  <style>
    /* Typography-Driven Minimalist Design System */
    :root {
      --primary-color: #000000;
      --accent-color: #7851A9;
      --bg-color: #ffffff;
      --text-color: #111111;
      --gray-border: #e0e0e0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 24px;
      width: 320px;
      margin: 0;
      box-sizing: border-box;
    }
    h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -1px;
      margin: 0 0 8px 0;
      text-transform: uppercase;
    }
    p {
      font-size: 13px;
      font-weight: 400;
      line-height: 1.5;
      margin-bottom: 20px;
      color: #555555;
    }
    .section-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: block;
      color: var(--primary-color);
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 13px;
      font-family: monospace;
      border: 2px solid var(--primary-color);
      border-radius: 0;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input:focus {
      border-color: var(--accent-color);
      box-shadow: 2px 2px 0px var(--accent-color);
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 13px;
      font-weight: 800;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
      box-shadow: 3px 3px 0px var(--accent-color);
      margin-bottom: 12px;
    }
    button:hover {
      background-color: var(--accent-color);
      box-shadow: 3px 3px 0px var(--primary-color);
    }
    button:active {
      transform: scale(0.98);
    }
    .secondary-btn {
      background-color: #ffffff;
      color: var(--primary-color);
      border: 2px solid var(--primary-color);
      box-shadow: 3px 3px 0px var(--primary-color);
    }
    .secondary-btn:hover {
      background-color: var(--primary-color);
      color: #ffffff;
      box-shadow: 3px 3px 0px var(--accent-color);
    }
    #status {
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      height: 16px;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 8px;
    }
    .divider {
      height: 1px;
      background-color: var(--gray-border);
      margin: 16px 0;
    }
    
    .advanced-toggle {
      cursor: pointer;
      color: var(--accent-color);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 16px;
      text-transform: uppercase;
      display: inline-block;
      user-select: none;
    }
    .advanced-toggle:hover {
      text-decoration: underline;
    }
    .advanced-content {
      display: none;
      padding-top: 8px;
    }
    .advanced-content.show {
      display: block;
    }
  </style>
</head>
<body>
  <h1>PaperIsHere</h1>
  <p>Configure save location and manage mirrors.</p>
  
  <span class="section-label">Save Folder (Inside Downloads)</span>
  <input type="text" id="saveLocation" placeholder="Renamed Papers">
  
  <div class="advanced-toggle" id="advToggle">▼ Advanced Settings</div>
  <div class="advanced-content" id="advContent">
      <span class="section-label">Gemini API Key</span>
      <input type="password" id="apiKey" placeholder="Paste your API key here...">
      
      <span class="section-label">Sci-Hub Mirror</span>
      <input type="text" id="sciHub" placeholder="https://sci-hub.st">
      
      <span class="section-label">Libgen Mirror</span>
      <input type="text" id="libgen" placeholder="https://libgen.li">
      
      <button id="autoBtn" class="secondary-btn" style="margin-bottom: 16px;">Auto-Ping Servers</button>
  </div>
  
  <button id="saveBtn">Save Configuration</button>
  
  <div class="divider"></div>
  
  <span class="section-label">Installation & Management</span>
  <button id="installGuideBtn" class="secondary-btn">Manage Extensions</button>
  
  <div id="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
